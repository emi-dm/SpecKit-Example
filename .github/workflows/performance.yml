name: Performance & Accessibility Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  start-server:
    name: Start Backend
    runs-on: ubuntu-latest
    outputs:
      server-url: ${{ steps.set-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Start backend
        working-directory: backend
        run: |
          npm run start &
          echo "Waiting for server to be ready..."
          npx wait-on http://localhost:3000 || (sleep 2 && npx wait-on http://localhost:3000)
      - name: Set server url
        id: set-url
        run: echo "::set-output name=url::http://localhost:3000"

  k6-baseline:
    name: k6 Baseline
    runs-on: ubuntu-latest
    needs: start-server
    steps:
      - uses: actions/checkout@v4
      - name: Run baseline k6 test
        uses: grafana/k6-action@v3
        with:
          script: backend/tests/performance/baseline.js

  accessibility:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    needs: start-server
    steps:
      - uses: actions/checkout@v4
      - name: Install pa11y CLI
        run: npm install -g pa11y
      - name: Run pa11y
        run: |
          echo "Running pa11y against http://localhost:3000"
          pa11y http://localhost:3000 || true
      - name: Fail on issues
        run: |
          pa11y http://localhost:3000 --reporter json > /tmp/pa11y.json
          node -e "const fs=require('fs');const issues=JSON.parse(fs.readFileSync('/tmp/pa11y.json')); if (issues.length>0){console.log('Accessibility issues found:',issues.length); process.exit(1)} else {console.log('No issues found')}}"
