<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Papers - Paper Repository</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS 3 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/src/styles/main.css">

    <script>
        tailwind.config = {
            prefix: 'tw-',
            corePlugins: {
                preflight: false,
            }
        }
    </script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark tw-shadow-lg">
        <div class="container">
            <a class="navbar-brand tw-font-bold" href="/">
                📚 Paper Repository
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/add.html">Add Paper</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/src/pages/browse.html">Browse</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container tw-py-8">
        <div class="row">
            <div class="col-12">
                <h1 class="tw-text-4xl tw-font-bold tw-mb-6 tw-text-gray-800">
                    Browse Repository
                </h1>

                <!-- Filters -->
                <div class="card tw-mb-6">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="filterSource" class="form-label">Source</label>
                                <select class="form-select" id="filterSource">
                                    <option value="">All Sources</option>
                                    <option value="arxiv">arXiv</option>
                                    <option value="dblp">DBLP</option>
                                    <option value="manual">Manual</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="filterYear" class="form-label">Year</label>
                                <input type="number" class="form-control" id="filterYear" placeholder="e.g., 2023"
                                    min="1900" max="2100">
                            </div>
                            <div class="col-md-4">
                                <label for="sortBy" class="form-label">Sort By</label>
                                <select class="form-select" id="sortBy">
                                    <option value="date">Publication Date (Newest)</option>
                                    <option value="citations">Citations</option>
                                    <option value="title">Title (A-Z)</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-primary tw-mt-3" id="applyFilters">
                            Apply Filters
                        </button>
                    </div>
                </div>

                <!-- Paper Count -->
                <div class="tw-mb-4" id="paperCount"></div>

                <!-- Paper List -->
                <div id="results-container"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main Script -->
    <script type="module">
        import api from '/src/services/api.js';

        // Load component
        async function loadComponent(url) {
            const response = await fetch(url);
            return response.text();
        }

        // Initialize
        async function init() {
            const paperListHTML = await loadComponent('/src/components/paper-list.html');
            document.getElementById('results-container').innerHTML = paperListHTML;

            // Load papers
            loadPapers();

            // Apply filters button
            document.getElementById('applyFilters').addEventListener('click', loadPapers);
        }

        // Load papers with filters
        async function loadPapers() {
            const filters = {
                source: document.getElementById('filterSource').value,
                year: document.getElementById('filterYear').value,
                sort: document.getElementById('sortBy').value
            };

            const paperCount = document.getElementById('paperCount');
            paperCount.innerHTML = '<div class="spinner"></div>';

            try {
                const data = await api.getPapers(filters);
                displayResults(data);

                const totalText = data.pagination.totalItems === 1
                    ? '1 paper'
                    : `${data.pagination.totalItems} papers`;
                paperCount.textContent = `Showing ${totalText}`;
            } catch (error) {
                paperCount.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        // Display results
        function displayResults(data) {
            const paperList = document.getElementById('paperList');
            const template = document.getElementById('paperCardTemplate');
            const emptyTemplate = document.getElementById('emptyStateTemplate');

            paperList.innerHTML = '';

            if (!data.papers || data.papers.length === 0) {
                paperList.appendChild(emptyTemplate.content.cloneNode(true));
                return;
            }

            data.papers.forEach(paper => {
                const card = template.content.cloneNode(true);

                card.querySelector('.paper-title').textContent = paper.title;
                card.querySelector('.paper-authors').textContent = paper.authors.map(a => a.name).join(', ');
                card.querySelector('.paper-source').textContent = paper.source.toUpperCase();
                card.querySelector('.paper-year').textContent = paper.year;
                card.querySelector('.paper-abstract').textContent = paper.abstract;
                card.querySelector('.paper-url').href = paper.url;

                if (paper.pdfUrl) {
                    const pdfBtn = card.querySelector('.paper-pdf');
                    pdfBtn.href = paper.pdfUrl;
                    pdfBtn.style.display = 'inline-block';
                }

                if (paper.citations > 0) {
                    const citationsBadge = card.querySelector('.paper-citations');
                    citationsBadge.textContent = `${paper.citations} citations`;
                    citationsBadge.style.display = 'inline-block';
                }

                const meta = [];
                if (paper.venue) meta.push(paper.venue);
                if (paper.doi) meta.push(`DOI: ${paper.doi}`);
                card.querySelector('.paper-meta').textContent = meta.join(' • ');

                // Delete handler
                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', async () => {
                    if (confirm('Delete this paper?')) {
                        try {
                            await api.deletePaper(paper.id);
                            loadPapers();
                        } catch (error) {
                            alert('Error deleting paper: ' + error.message);
                        }
                    }
                });

                paperList.appendChild(card);
            });
        }

        // Initialize on load
        init();
    </script>
</body>

</html>
