<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Repository - Academic Research Papers</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS 3 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/src/styles/main.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            prefix: 'tw-',
            corePlugins: {
                preflight: false,
            }
        }
    </script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark tw-shadow-lg">
        <div class="container">
            <a class="navbar-brand tw-font-bold" href="/">
                📚 Paper Repository
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/add.html">Add Paper</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/browse.html">Browse</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container tw-py-8">
        <div class="row">
            <div class="col-12">
                <h1 class="tw-text-4xl tw-font-bold tw-mb-6 tw-text-gray-800">
                    Search Academic Papers
                </h1>
                <p class="tw-text-gray-600 tw-mb-8">
                    Search and discover research papers from arXiv and DBLP
                </p>

                <!-- Search Component will be loaded here -->
                <div id="search-container"></div>

                <!-- Results will be loaded here -->
                <div id="results-container" class="tw-mt-8"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API Client -->
    <script type="module" src="/src/services/api.js"></script>

    <!-- Main App -->
    <script type="module">
        import api from '/src/services/api.js';

        // Load components
        async function loadComponent(url) {
            const response = await fetch(url);
            return response.text();
        }

        // Initialize search
        async function initSearch() {
            const searchHTML = await loadComponent('/src/components/search.html');
            const paperListHTML = await loadComponent('/src/components/paper-list.html');

            document.getElementById('search-container').innerHTML = searchHTML;
            document.getElementById('results-container').innerHTML = paperListHTML;

            // Attach search handler
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchStatus = document.getElementById('searchStatus');

            searchForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();

                if (!query) return;

                searchStatus.innerHTML = '<div class="spinner"></div>';

                try {
                    const data = await api.searchPapers(query);
                    displayResults(data);
                    searchStatus.textContent = `Found ${data.totalResults} results`;
                } catch (error) {
                    searchStatus.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                }
            });

            // Load initial papers (browse all)
            loadAllPapers();
        }

        // Load all papers
        async function loadAllPapers() {
            const searchStatus = document.getElementById('searchStatus');
            searchStatus.innerHTML = '<div class="spinner"></div>';

            try {
                const data = await api.getPapers();
                displayResults({ results: data.papers, totalResults: data.pagination.totalItems });
                searchStatus.textContent = data.papers.length > 0 ? `Showing ${data.papers.length} papers` : 'No papers in repository yet';
            } catch (error) {
                searchStatus.innerHTML = `<div class="alert alert-danger">Error loading papers: ${error.message}</div>`;
            }
        }

        // Display search/browse results
        function displayResults(data) {
            const paperList = document.getElementById('paperList');
            const template = document.getElementById('paperCardTemplate');
            const emptyTemplate = document.getElementById('emptyStateTemplate');

            paperList.innerHTML = '';

            if (!data.results || data.results.length === 0) {
                paperList.appendChild(emptyTemplate.content.cloneNode(true));
                return;
            }

            data.results.forEach(paper => {
                const card = template.content.cloneNode(true);

                card.querySelector('.paper-title').textContent = paper.title;
                card.querySelector('.paper-authors').textContent = paper.authors.map(a => a.name).join(', ');
                card.querySelector('.paper-source').textContent = paper.source.toUpperCase();
                card.querySelector('.paper-year').textContent = paper.year;
                card.querySelector('.paper-abstract').textContent = paper.abstract;
                card.querySelector('.paper-url').href = paper.url;

                if (paper.pdfUrl) {
                    const pdfBtn = card.querySelector('.paper-pdf');
                    pdfBtn.href = paper.pdfUrl;
                    pdfBtn.style.display = 'inline-block';
                }

                if (paper.citations > 0) {
                    const citationsBadge = card.querySelector('.paper-citations');
                    citationsBadge.textContent = `${paper.citations} citations`;
                    citationsBadge.style.display = 'inline-block';
                }

                const meta = [];
                if (paper.venue) meta.push(paper.venue);
                if (paper.doi) meta.push(`DOI: ${paper.doi}`);
                card.querySelector('.paper-meta').textContent = meta.join(' • ');

                // Delete handler
                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', async () => {
                    if (confirm('Delete this paper?')) {
                        try {
                            await api.deletePaper(paper.id);
                            loadAllPapers();
                        } catch (error) {
                            alert('Error deleting paper: ' + error.message);
                        }
                    }
                });

                paperList.appendChild(card);
            });
        }

        // Initialize on load
        initSearch();
    </script>
</body>

</html>
